name: 部署到 Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 同時只跑一個部署，避免兩次 push 互相覆蓋
concurrency:
  group: firebase-hosting
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 取得原始碼
        uses: actions/checkout@v7

      - name: 安裝 Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # 沒有 package-lock.json，所以用 install 不是 ci
      - name: 安裝相依套件
        run: npm install

      - name: 執行測試
        run: npm test

      - name: 建置 public/
        run: npm run build

      - name: 部署到 Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::找不到 FIREBASE_SERVICE_ACCOUNT secret。請到 repo 的 Settings → Secrets and variables → Actions 建立後再重跑。"
            exit 1
          fi
          key="$RUNNER_TEMP/firebase-key.json"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$key"
          export GOOGLE_APPLICATION_CREDENTIALS="$key"
          npx --yes firebase-tools@15 deploy \
            --only hosting \
            --project g27-bead-allocator \
            --non-interactive \
            --message "${GITHUB_SHA:0:7} ${GITHUB_REF_NAME}"
